module_name: gz_bridge
parameters:
- group: Simulation
  definitions:
    SIM_GZ_EN_LIDAR:
      description:
        short: Enable laser/lidar sensors in Gazebo bridge
      type: enum
      values:
        0: Disabled
        1: Enabled
      default: 1
      reboot_required: true
    SIM_GZ_EN_FLOW:
      description:
        short: Enable optical flow sensor in Gazebo bridge
      type: enum
      values:
        0: Disabled
        1: Enabled
      default: 1
      reboot_required: true
    SIM_GZ_EN_ASPD:
      description:
        short: Enable airspeed sensor in Gazebo bridge
      type: enum
      values:
        0: Disabled
        1: Enabled
      default: 1
      reboot_required: true
    SIM_GZ_EN_BARO:
      description:
        short: Enable barometer/air pressure sensor in Gazebo bridge
      type: enum
      values:
        0: Disabled
        1: Enabled
      default: 1
      reboot_required: true
    SIM_GZ_EN_ODOM:
      description:
        short: Enable odometry in Gazebo bridge
      type: enum
      values:
        0: Disabled
        1: Enabled
      default: 1
      reboot_required: true
    SIM_GZ_EN_GPS:
      description:
        short: Enable GPS/NavSat sensor in Gazebo bridge
      type: enum
      values:
        0: Disabled
        1: Enabled
      default: 1
      reboot_required: true
    SIM_GZ_GPS_PNOIS:
      description:
        short: Simulated GPS position noise amplitude
        long: |-
          Scales the correlated (Gauss-Markov) position noise added to the
          Gazebo NavSat sensor. The resulting horizontal standard deviation
          is about 0.027 times this value.
      type: float
      default: 0.8
      min: 0.0
      max: 200.0
      decimal: 2
      unit: m
    SIM_GZ_GPS_VNOIS:
      description:
        short: Simulated GPS velocity noise amplitude
        long: |-
          Scales the correlated (Gauss-Markov) velocity noise added to the
          Gazebo NavSat sensor. The resulting horizontal standard deviation
          is about 0.38 times this value.
      type: float
      default: 0.05
      min: 0.0
      max: 10.0
      decimal: 3
      unit: m/s
    SIM_GZ_GPS_EPH:
      description:
        short: Simulated GPS reported horizontal accuracy
      type: float
      default: 0.9
      min: 0.01
      max: 100.0
      decimal: 2
      unit: m
    SIM_GZ_GPS_EPV:
      description:
        short: Simulated GPS reported vertical accuracy
      type: float
      default: 1.78
      min: 0.01
      max: 100.0
      decimal: 2
      unit: m
    SIM_GZ_GPS_DIV:
      description:
        short: Simulated GPS rate divider
        long: |-
          Only every Nth sample of the Gazebo NavSat sensor is published,
          e.g. 6 turns the 30 Hz of the x500 model into 5 Hz.
      type: int32
      default: 1
      min: 1
      max: 300
- group: UAVCAN
  definitions:
    SIM_GZ_EN:
      description:
        short: Simulator Gazebo bridge enable
      type: boolean
      default: 0
      reboot_required: true
